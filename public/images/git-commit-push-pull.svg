<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Commit, push, and pull mental model</title>
  <desc id="desc">Diagram distinguishing working files, staging, local commits, and GitHub. Push sends local commits to GitHub; pull brings shared commits back.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .panel { fill:#f8fafc; stroke:#d1d5db; stroke-width:2; rx:28; }
      .box { fill:#ffffff; stroke:#1f2937; stroke-width:4; rx:18; }
      .box-blue { fill:#eff6ff; stroke:#1d4ed8; }
      .box-green { fill:#ecfdf5; stroke:#047857; }
      .box-teal { fill:#ecfeff; stroke:#0f766e; }
      .box-amber { fill:#fffbeb; stroke:#b45309; }
      .box-purple { fill:#f5f3ff; stroke:#6d28d9; }
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .subtitle { font: 400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .label { font: 700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
      .tiny { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .arrow { stroke:#1f2937; stroke-width:3.5; fill:none; stroke-linecap:round; marker-end:url(#arrow); }
      .dash { stroke-dasharray:12 10; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <text x="70" y="70" class="title">Commit saves locally; push shares commits</text>
  <text x="70" y="108" class="subtitle">A push does not gather loose file edits. It sends commits that already exist.</text>
  <rect x="55" y="150" width="1290" height="400" class="panel"/>
  <rect x="100" y="225" width="240" height="135" class="box box-blue"/>
  <text x="220" y="278" text-anchor="middle" class="label">working files</text>
  <text x="220" y="318" text-anchor="middle" class="small">edits</text>
  <rect x="425" y="225" width="240" height="135" class="box box-green"/>
  <text x="545" y="278" text-anchor="middle" class="label">staging</text>
  <text x="545" y="318" text-anchor="middle" class="small">selected work</text>
  <rect x="750" y="225" width="240" height="135" class="box box-purple"/>
  <text x="870" y="278" text-anchor="middle" class="label">local commits</text>
  <text x="870" y="318" text-anchor="middle" class="small">saved history</text>
  <rect x="1075" y="225" width="240" height="135" class="box box-teal"/>
  <text x="1195" y="278" text-anchor="middle" class="label">GitHub</text>
  <text x="1195" y="318" text-anchor="middle" class="small">shared commits</text>
  <path d="M 355 292 L 405 292" class="arrow"/><text x="380" y="268" text-anchor="middle" class="small">add</text>
  <path d="M 680 292 L 730 292" class="arrow"/><text x="705" y="268" text-anchor="middle" class="small">commit</text>
  <path d="M 1005 292 L 1055 292" class="arrow"/><text x="1030" y="268" text-anchor="middle" class="small">push</text>
  <path d="M 1075 395 C 970 470, 910 470, 805 395" class="arrow dash"/>
  <text x="940" y="470" text-anchor="middle" class="small">pull brings shared commits back</text>
</svg>
