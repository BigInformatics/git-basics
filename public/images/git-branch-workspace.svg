<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Branch as safe workspace</title>
  <desc id="desc">Diagram showing main as a stable line and a branch splitting off as a separate workspace for a proposed change.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .panel { fill:#f8fafc; stroke:#d1d5db; stroke-width:2; rx:28; }
      .box { fill:#ffffff; stroke:#1f2937; stroke-width:4; rx:18; }
      .box-blue { fill:#eff6ff; stroke:#1d4ed8; }
      .box-green { fill:#ecfdf5; stroke:#047857; }
      .box-teal { fill:#ecfeff; stroke:#0f766e; }
      .box-amber { fill:#fffbeb; stroke:#b45309; }
      .box-purple { fill:#f5f3ff; stroke:#6d28d9; }
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .subtitle { font: 400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .label { font: 700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
      .tiny { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .arrow { stroke:#1f2937; stroke-width:3.5; fill:none; stroke-linecap:round; marker-end:url(#arrow); }
      .dash { stroke-dasharray:12 10; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <text x="70" y="70" class="title">A branch is a safe workspace for proposed change</text>
  <text x="70" y="108" class="subtitle">Start from updated main, then make a named path for one focused piece of work.</text>
  <rect x="55" y="150" width="1290" height="395" class="panel"/>
  <path d="M 155 360 C 380 360, 595 360, 820 360 S 1130 360, 1240 360" stroke="#1d4ed8" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="160" y="410" class="label">main</text>
  <path d="M 440 360 C 535 245, 710 238, 885 255 S 1110 285, 1235 245" stroke="#047857" stroke-width="7" fill="none" stroke-linecap="round"/>
  <text x="655" y="220" class="label">your branch</text>
  <circle cx="440" cy="360" r="18" fill="#ffffff" stroke="#111827" stroke-width="5"/>
  <text x="440" y="430" text-anchor="middle" class="small">branch here</text>
  <circle cx="1235" cy="245" r="18" fill="#ffffff" stroke="#111827" stroke-width="5"/>
  <text x="1125" y="210" class="small">push branch to GitHub</text>
  <rect x="185" y="485" width="1030" height="36" fill="#ffffff" opacity="0"/>
  <text x="185" y="505" class="small">Main stays stable while review happens on the branch.</text>
</svg>
