<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="880" viewBox="0 0 1400 880" role="img" aria-labelledby="title desc">
  <title id="title">Local branch and GitHub branch view</title>
  <desc id="desc">Diagram showing that main exists on both your computer and GitHub, while a new branch starts locally and appears on GitHub after pushing.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .panel { fill:#f8fafc; stroke:#d1d5db; stroke-width:2; rx:30; }
      .local { fill:#eff6ff; stroke:#1d4ed8; stroke-width:3.5; rx:24; }
      .remote { fill:#ecfdf5; stroke:#047857; stroke-width:3.5; rx:24; }
      .main { fill:#ffffff; stroke:#1d4ed8; stroke-width:3.5; rx:18; }
      .branch { fill:#ffffff; stroke:#047857; stroke-width:3.5; rx:18; }
      .muted { fill:#f9fafb; stroke:#9ca3af; stroke-width:2.5; rx:18; }
      .callout { fill:#fffbeb; stroke:#b45309; stroke-width:3.5; rx:20; }
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .subtitle { font: 400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .label { font: 700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .small { font: 500 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
      .tiny { font: 500 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .code { font: 700 22px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#111827; }
      .arrow { stroke:#1f2937; stroke-width:3.5; fill:none; stroke-linecap:round; marker-end:url(#arrow); }
      .soft-arrow { stroke:#6b7280; stroke-width:3; fill:none; stroke-linecap:round; marker-end:url(#arrow); stroke-dasharray:10 10; }
      .branch-line { stroke:#047857; stroke-width:6; fill:none; stroke-linecap:round; }
      .main-line { stroke:#1d4ed8; stroke-width:6; fill:none; stroke-linecap:round; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <text x="70" y="72" class="title">A branch starts local, then appears on GitHub after push</text>
  <text x="70" y="112" class="subtitle">Your computer and GitHub can both know about main, but a new branch is local until you send it up.</text>

  <rect x="55" y="150" width="1290" height="620" class="panel"/>

  <rect x="105" y="215" width="500" height="345" class="local"/>
  <text x="355" y="270" text-anchor="middle" class="label">Your computer</text>
  <text x="355" y="302" text-anchor="middle" class="small">local repository</text>

  <rect x="795" y="215" width="500" height="345" class="remote"/>
  <text x="1045" y="270" text-anchor="middle" class="label">GitHub</text>
  <text x="1045" y="302" text-anchor="middle" class="small">remote repository</text>

  <rect x="165" y="340" width="380" height="78" class="main"/>
  <text x="355" y="388" text-anchor="middle" class="code">main</text>
  <path d="M 225 452 C 300 452, 410 452, 500 452" class="main-line"/>
  <text x="355" y="494" text-anchor="middle" class="tiny">stable shared starting point</text>

  <rect x="855" y="340" width="380" height="78" class="main"/>
  <text x="1045" y="388" text-anchor="middle" class="code">origin/main</text>
  <path d="M 915 452 C 990 452, 1100 452, 1190 452" class="main-line"/>
  <text x="1045" y="494" text-anchor="middle" class="tiny">GitHub's copy of main</text>

  <path d="M 555 380 C 630 350, 720 350, 805 380" class="soft-arrow"/>
  <text x="700" y="340" text-anchor="middle" class="small">pull keeps main updated</text>

  <rect x="165" y="555" width="380" height="78" class="branch"/>
  <text x="355" y="603" text-anchor="middle" class="code">analysis/clarify-visit-query</text>
  <path d="M 240 535 C 315 495, 430 500, 505 535" class="branch-line"/>
  <text x="355" y="662" text-anchor="middle" class="tiny">created locally with git switch -c</text>

  <rect x="855" y="555" width="380" height="78" class="muted"/>
  <text x="1045" y="603" text-anchor="middle" class="code">branch on GitHub</text>
  <text x="1045" y="662" text-anchor="middle" class="tiny">appears only after push</text>

  <path d="M 555 594 C 660 530, 750 530, 845 594" class="arrow"/>
  <text x="700" y="532" text-anchor="middle" class="label">git push -u origin HEAD</text>

  <rect x="130" y="690" width="1140" height="66" class="callout"/>
  <text x="700" y="731" text-anchor="middle" class="small">Before push: the branch is only on your computer. After push: GitHub can show it, share it, and open a pull request.</text>
</svg>
