<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700" role="img" aria-labelledby="title desc">
  <title id="title">Complete beginner Git workflow</title>
  <desc id="desc">Diagram of the workflow: start updated, branch, edit, inspect, stage, commit, push, PR, review, merge, update main.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .panel { fill:#f8fafc; stroke:#d1d5db; stroke-width:2; rx:28; }
      .box { fill:#ffffff; stroke:#1f2937; stroke-width:4; rx:18; }
      .box-blue { fill:#eff6ff; stroke:#1d4ed8; }
      .box-green { fill:#ecfdf5; stroke:#047857; }
      .box-teal { fill:#ecfeff; stroke:#0f766e; }
      .box-amber { fill:#fffbeb; stroke:#b45309; }
      .box-purple { fill:#f5f3ff; stroke:#6d28d9; }
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .subtitle { font: 400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .label { font: 700 25px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
      .tiny { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .arrow { stroke:#1f2937; stroke-width:5; fill:none; stroke-linecap:round; marker-end:url(#arrow); }
      .dash { stroke-dasharray:12 10; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <text x="70" y="70" class="title">Complete beginner workflow</text>
  <text x="70" y="108" class="subtitle">One safe path from current main to reviewed shared work.</text>
  <rect x="45" y="135" width="1310" height="360" class="panel"/>
  <path d="M 263 207.0 L 283 207.0" class="arrow"/>
  <path d="M 484 207.0 L 504 207.0" class="arrow"/>
  <path d="M 705 207.0 L 725 207.0" class="arrow"/>
  <path d="M 926 207.0 L 946 207.0" class="arrow"/>
  <path d="M 1147 207.0 L 1167 207.0" class="arrow"/>
  <path d="M 1368 207.0 L 1388 207.0" class="arrow"/>
  <path d="M 1488.5 254 C 1488.5 310, 825.5 255, 825.5 350" class="arrow"/>
  <path d="M 926 397.0 L 946 397.0" class="arrow"/>
  <path d="M 1147 397.0 L 1167 397.0" class="arrow"/>
  <path d="M 1368 397.0 L 1388 397.0" class="arrow"/>
  <rect x="70" y="170" width="185" height="74" class="box box-blue"/>
  <text x="162.5" y="216" text-anchor="middle" class="label">start updated</text>
  <rect x="291" y="170" width="185" height="74" class="box box-green"/>
  <text x="383.5" y="216" text-anchor="middle" class="label">branch</text>
  <rect x="512" y="170" width="185" height="74" class="box box-blue"/>
  <text x="604.5" y="216" text-anchor="middle" class="label">edit</text>
  <rect x="733" y="170" width="185" height="74" class="box box-amber"/>
  <text x="825.5" y="216" text-anchor="middle" class="label">inspect</text>
  <rect x="954" y="170" width="185" height="74" class="box box-green"/>
  <text x="1046.5" y="216" text-anchor="middle" class="label">stage</text>
  <rect x="1175" y="170" width="185" height="74" class="box box-purple"/>
  <text x="1267.5" y="216" text-anchor="middle" class="label">commit</text>
  <rect x="1396" y="170" width="185" height="74" class="box box-teal"/>
  <text x="1488.5" y="216" text-anchor="middle" class="label">push</text>
  <rect x="733" y="360" width="185" height="74" class="box box-purple"/>
  <text x="825.5" y="406" text-anchor="middle" class="label">PR</text>
  <rect x="954" y="360" width="185" height="74" class="box box-amber"/>
  <text x="1046.5" y="406" text-anchor="middle" class="label">review</text>
  <rect x="1175" y="360" width="185" height="74" class="box box-green"/>
  <text x="1267.5" y="406" text-anchor="middle" class="label">merge</text>
  <rect x="1396" y="360" width="185" height="74" class="box box-blue"/>
  <text x="1488.5" y="406" text-anchor="middle" class="label">update main</text>
  <text x="70" y="580" class="small">Inspect before staging. Push sends commits. PR is the review point before merge.</text>
</svg>
