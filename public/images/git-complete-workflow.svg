<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Complete beginner Git workflow</title>
  <desc id="desc">Diagram showing the complete beginner workflow in four digestible phases: start current, work locally, share for review, then merge and update main.</desc>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 7 3.5 L 0 7 z" fill="#1f2937" />
    </marker>
    <style>
      .bg { fill:#ffffff; }
      .panel { fill:#f8fafc; stroke:#d1d5db; stroke-width:2; rx:28; }
      .phase { fill:#ffffff; stroke:#d1d5db; stroke-width:2; rx:22; }
      .box { stroke-width:4; rx:16; }
      .blue { fill:#eff6ff; stroke:#1d4ed8; }
      .green { fill:#ecfdf5; stroke:#047857; }
      .teal { fill:#ecfeff; stroke:#0f766e; }
      .amber { fill:#fffbeb; stroke:#b45309; }
      .purple { fill:#f5f3ff; stroke:#6d28d9; }
      .title { font: 700 38px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .subtitle { font: 400 22px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .phaseLabel { font: 700 20px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
      .label { font: 700 21px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#111827; }
      .small { font: 500 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#374151; }
      .tiny { font: 500 15px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; fill:#4b5563; }
      .arrow { stroke:#1f2937; stroke-width:3.5; fill:none; stroke-linecap:round; marker-end:url(#arrow); }
      .return { stroke:#6b7280; stroke-width:3; fill:none; stroke-linecap:round; marker-end:url(#arrow); stroke-dasharray:10 10; }
    </style>
  </defs>
  <rect class="bg" width="100%" height="100%"/>
  <text x="70" y="72" class="title">Complete beginner workflow</text>
  <text x="70" y="112" class="subtitle">A safe loop: begin from current main, work locally, ask for review, then update main again.</text>
  <rect x="55" y="150" width="1290" height="500" class="panel"/>

  <rect x="85" y="185" width="250" height="170" class="phase"/>
  <text x="110" y="218" class="phaseLabel">1. Start current</text>
  <rect x="115" y="245" width="190" height="70" class="box blue"/>
  <text x="210" y="288" text-anchor="middle" class="label">start updated</text>

  <rect x="370" y="185" width="535" height="170" class="phase"/>
  <text x="395" y="218" class="phaseLabel">2. Work locally</text>
  <rect x="400" y="245" width="110" height="70" class="box green"/><text x="455" y="288" text-anchor="middle" class="label">branch</text>
  <rect x="540" y="245" width="110" height="70" class="box blue"/><text x="595" y="288" text-anchor="middle" class="label">edit</text>
  <rect x="680" y="245" width="110" height="70" class="box amber"/><text x="735" y="288" text-anchor="middle" class="label">inspect</text>
  <rect x="820" y="245" width="65" height="70" class="box green"/><text x="852" y="288" text-anchor="middle" class="label">stage</text>

  <rect x="940" y="185" width="370" height="170" class="phase"/>
  <text x="965" y="218" class="phaseLabel">3. Save and share</text>
  <rect x="970" y="245" width="135" height="70" class="box purple"/><text x="1037" y="288" text-anchor="middle" class="label">commit</text>
  <rect x="1140" y="245" width="135" height="70" class="box teal"/><text x="1207" y="288" text-anchor="middle" class="label">push</text>

  <rect x="370" y="420" width="760" height="170" class="phase"/>
  <text x="395" y="453" class="phaseLabel">4. Review, merge, update</text>
  <rect x="405" y="480" width="120" height="70" class="box purple"/><text x="465" y="523" text-anchor="middle" class="label">PR</text>
  <rect x="560" y="480" width="140" height="70" class="box amber"/><text x="630" y="523" text-anchor="middle" class="label">review</text>
  <rect x="735" y="480" width="140" height="70" class="box green"/><text x="805" y="523" text-anchor="middle" class="label">merge</text>
  <rect x="910" y="480" width="185" height="70" class="box blue"/><text x="1002" y="523" text-anchor="middle" class="label">update main</text>

  <path d="M 315 280 L 385 280" class="arrow"/>
  <path d="M 515 280 L 525 280" class="arrow"/>
  <path d="M 655 280 L 665 280" class="arrow"/>
  <path d="M 795 280 L 808 280" class="arrow"/>
  <path d="M 900 280 L 955 280" class="arrow"/>
  <path d="M 1110 280 L 1125 280" class="arrow"/>
  <path d="M 1207 330 C 1207 390, 470 390, 390 515" class="arrow"/>
  <path d="M 530 515 L 545 515" class="arrow"/>
  <path d="M 705 515 L 720 515" class="arrow"/>
  <path d="M 880 515 L 895 515" class="arrow"/>
  <path d="M 1002 560 C 920 635, 300 660, 210 330" class="return"/>

  <text x="85" y="710" class="small">Remember: push shares commits; the pull request is the review point; updating main closes the loop for next time.</text>
</svg>
